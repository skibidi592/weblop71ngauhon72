<style>
:root{--bg:#dbe6f6;--p1:#cddcf2;--p2:#eef4fc;--tx:#15233d;--mu:#566a8c;--ac:#2563c9;--ak:#fff;--ln:#b6c9e6;--sp:#2f6fe0;--rd:#c0392b;--gr:#2f8f5b;color-scheme:light}

:root[data-theme=dark]{--bg:#0c1525;--p1:#111d35;--p2:#172745;--tx:#e3ecf9;--mu:#8da2c4;--ac:#6aa8ff;--ak:#071530;--ln:#233659;--sp:#7cc3ff;--rd:#ef7468;--gr:#4cc38a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;-webkit-text-size-adjust:100%}html{height:var(--vh,100%)}#root{height:100%;min-height:0}
:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:14.5px/1.5 'Plus Jakarta Sans','Be Vietnam Pro','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:var(--ak);border-radius:8px;padding:8px 14px;font-weight:700}.btn.g{background:var(--p1);color:var(--tx);border:1px solid var(--ln)}.btn.r{background:var(--rd);color:#fff}.btn.s{padding:3px 8px;font-size:12px}
input,select{background:var(--p1);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;width:100%;outline:0}input:focus,select:focus{border-color:var(--ac)}
#bgv{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.42;pointer-events:none;z-index:0}#fx{position:fixed;top:0;left:0;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}#app{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr) 216px;grid-template-rows:minmax(0,1fr);height:100%}

.sec{padding:14px 14px 4px;font-size:11px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}

.vm{display:flex;align-items:center;gap:6px;margin:2px 8px 2px 30px;font-size:13px;color:var(--mu)}

.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}.ic:hover{background:var(--p1)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background-size:cover;background-position:center;flex:none;position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--gr);border:2px solid var(--p1)}.off{opacity:.45}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
#hd{padding:14px 18px;border-bottom:1px solid var(--ln);font-weight:700;display:flex;gap:8px;align-items:center}#hd small{color:var(--mu);font-weight:400}
#msgs{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 18px}
.m{display:flex;gap:12px;padding:5px 0}.m .b{min-width:0}.m .t{font-size:11px;color:var(--mu);margin-left:6px}.m .x{white-space:pre-wrap;word-break:break-word;line-height:1.6}.m img{max-width:min(320px,100%);border-radius:10px;margin-top:6px;display:block}
.role{font-size:10px;border:1px solid;border-radius:5px;padding:0 5px;margin-left:6px}
#cmp,#emo{flex:none}#cmp{margin:0 18px 16px;display:flex;gap:6px;align-items:center;background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:6px}#cmp input{border:0;background:none;flex:1;min-width:0}

.ov{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:#0008;display:grid;place-items:center;z-index:9;padding:16px}.box{background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:20px;width:min(520px,100%);max-height:88%;overflow:auto;display:grid;gap:10px}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln)}.row .nm{flex:1 1 140px;min-width:0}

function adminUI(){const rs=Object.entries(S.roles),R=can("roles");modal(`<h3>🛡️ Bảng điều khiển</h3>${R?`<b>Vai trò và quyền hạn</b>${rs.map(([id,r])=>`<div class="rr"><div class="row"><span class="nm" style="color:${esc(r.color)}">● ${esc(r.name)}</span><button class="btn g s" onclick="delRole('${id}')">Xoá</button></div><div class="pp">${pchk(id,r.perms||[])}</div></div>`).join("")}<div class="rr"><div style="display:flex;gap:6px"><input id="rn" placeholder="Tên vai trò mới"><input id="rc" type="color" value="#6aa8ff" style="width:54px;padding:2px"><button class="btn s" onclick="addRole()">Thêm</button></div><div class="pp" id="rp">${pchk("",[])}</div></div>`:""}<b>Thành viên</b>${N.map((n,i)=>{const u="u"+(i+1),m=S.mod[u]||{},o=p=>canOn(p,u);if(ADMINS.has(u))return`<div class="row"><span class="nm">${i+1}. ${esc(n)} 👑 Admin</span>${isAdm(S.me)&&u!==S.me?`<button class="btn g s" onclick="resetPin('${u}')">Đổi PIN</button>`:""}</div>`;return`<div class="row"><span class="nm" style="color:${nc(u)}">${i+1}. ${esc(n)}${m.muted?" 🔇":""}${m.banned?" ⛔":""}</span>${o("roles")?`<select style="width:90px;padding:3px" onchange="modU('${u}',{role:this.value})"><option value="">Vai trò</option>${rs.filter(([id,r])=>isAdm(S.me)||(r.perms||[]).every(p=>can(p))).map(([id,r])=>`<option value="${id}" ${m.role===id?"selected":""}>${esc(r.name)}</option>`).join("")}</select>`:""}${o("warn")?`<button class="btn g s" onclick="warnU('${u}')">Warn</button>`:""}${o("mute")?`<button class="btn g s" onclick="modU('${u}',{muted:${!m.muted}})">${m.muted?"Unmute":"Mute"}</button>`:""}${o("kick")?`<button class="btn g s" onclick="modU('${u}',{kickAt:Date.now()})">Kick</button>`:""}${o("ban")?`<button class="btn ${m.banned?"g":"r"} s" onclick="modU('${u}',{banned:${!m.banned}})">${m.banned?"Unban":"Ban"}</button>`:""}${isAdm(S.me)?`<button class="btn g s" onclick="resetPin('${u}')">Đổi PIN</button>`:""}</div>`}).join("")}`)}
async function resetPin(u){if(!isAdm(S.me))return;const n=prompt("Mã PIN mới cho "+NM[u]+" (ít nhất 4 ký tự). Để trống = về mặc định 1234:");if(n===null)return;if(n&&n.length<4)return toast("PIN cần ít nhất 4 ký tự");const d={...(S.users[u]||{})};if(n)d.pin=await H(u,n);else delete d.pin;await store.set("users",u,d);LOG("đã đổi PIN của "+NM[u]);toast("Đã đổi PIN của "+NM[u])}
function modU(u,p){const n=NM[u];let t="";if("muted" in p)t=(p.muted?"đã Mute ":"đã Unmute ")+n;else if(p.kickAt)t="đã Kick "+n;else if("banned" in p)t=(p.banned?"đã Ban ":"đã Unban ")+n;else if(p.warn)t="đã Warn "+n+": “"+p.warn.text+"”";else if("role" in p)t=p.role?"đã gán vai trò “"+(S.roles[p.role]?.name||"?")+"” cho "+n:"đã gỡ vai trò của "+n;t&&LOG(t);store.set("mod",u,{...S.mod[u],...p}).then(()=>setTimeout(adminUI,150))}
function warnU(u){const t=prompt("Nội dung cảnh cáo:");if(t)modU(u,{warn:{text:t,ts:Date.now()}})}
function addRole(){const n=$("#rn").value.trim();if(n)LOG("đã tạo vai trò “"+n+"”");if(n)store.set("roles",mid(),{name:n,color:$("#rc").value,perms:[...document.querySelectorAll("#rp input:checked")].map(i=>i.value)}).then(()=>setTimeout(adminUI,150))}

  store.sub("users",l=>{S.users=Object.fromEntries(l.map(x=>[x.id,x]));S.v=(S.v||0)+1;d("u");draw()});store.sub("mod",l=>{S.mod=Object.fromEntries(l.map(x=>[x.id,x]));S.v=(S.v||0)+1;d("m");draw()})});
 store.sub("roles",l=>{S.roles=Object.fromEntries(l.map(x=>[x.id,x]));S.v=(S.v||0)+1;draw()});store.sub("msgs",l=>{S.msgs=l;draw()},150);
 room&&room.onPeers(p=>{S.peers=p;draw()});
 await wait(first,4000);
 const s=LS("c71s");
 if(s&&NM[s.uid]){const m=S.mod[s.uid]||{};let ok=!m.banned&&(m.kickAt||0)<=s.t;
  if(S.got.u)ok=ok&&s.h===(S.users[s.uid]?.pin||(s.uid==="admin"?ADMIN_H0:await H(s.uid,"1234")));
  if(ok){sess=s;S.me=s.uid;room&&room.presence({uid:s.uid,voice:null,mic:true});return render()}}
 loginUI()})();
